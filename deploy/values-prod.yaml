image:
  repository: ghcr.io/adam6878/release-notes
  tag: ""

config:
  logLevel: INFO


service:
  type: NodePort
  nodePort: 30081

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4

resources:
  requests:
    cpu: 200m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 384Mi

postgres:
  storage: 2Gi
