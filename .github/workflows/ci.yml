name: ci

# Every push and pull request: lint, test, validate the chart, build the image.
# Publishing happens in cd.yml, only after this workflow succeeds on main.
on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: release
          POSTGRES_PASSWORD: test
          POSTGRES_DB: releases
        ports: ["5432:5432"]
        # Check over TCP: during first-time init Postgres answers only on its Unix socket,
        # so a socket check would report ready before the real server is up.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U release -d releases"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite
        run: pytest
      - name: Tests on PostgreSQL (the production engine)
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://release:test@localhost:5432/releases

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0
      - name: Lint, render and schema-check both environments
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for env in dev prod; do
            helm lint deploy -f deploy/values-$env.yaml --set image.tag=ci
            helm template release-notes deploy -f deploy/values-$env.yaml --set image.tag=ci \
              | ./kubeconform -strict -summary
          done

  image:
    needs: [lint, test, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Not pushed. The cache lets cd.yml rebuild the same image in seconds.
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: release-notes:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
