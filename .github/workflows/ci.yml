name: ci

# Every push and pull request: lint, test, validate the chart, build the image.
# Push to main only: publish the image and point prod at it (GitOps, see DECISIONS.md).
on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: release
          POSTGRES_PASSWORD: test
          POSTGRES_DB: releases
        ports: ["5432:5432"]
        # Check over TCP: during first-time init Postgres answers only on its Unix socket,
        # so a socket check would report ready before the real server is up.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U release -d releases"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite
        run: pytest
      - name: Tests on PostgreSQL (the production engine)
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://release:test@localhost:5432/releases

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0
      - name: Lint, render and schema-check both environments
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for env in dev prod; do
            helm lint deploy -f deploy/values-$env.yaml --set image.tag=ci
            helm template release-notes deploy -f deploy/values-$env.yaml --set image.tag=ci \
              | ./kubeconform -strict -summary
          done

  image:
    needs: [lint, test, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      repository: ${{ steps.name.outputs.repository }}
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        # GHCR needs a lowercase owner. The tag is the commit SHA, so an image always maps to its source.
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/release-notes" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ steps.name.outputs.repository }}:${{ steps.name.outputs.tag }}
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitOps: CI never talks to a cluster. It commits the new image to values-prod.yaml,
  # and the cluster's GitOps agent (Argo CD or Flux) applies whatever main says.
  update-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Point prod at the new image
        env:
          REPOSITORY: ${{ needs.image.outputs.repository }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          yq -i '.image.repository = strenv(REPOSITORY) | .image.tag = strenv(TAG)' deploy/values-prod.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(prod): release-notes ${TAG}"
          # A push made with GITHUB_TOKEN does not trigger another workflow run, so this cannot loop.
          git pull --rebase && git push
