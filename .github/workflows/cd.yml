name: cd

# After ci succeeds on a push to main: publish the image and point prod at it.
# GitOps: CD never talks to a cluster. It commits the new image to values-prod.yaml,
# and the cluster's GitOps agent ArgoCD applies whatever main says.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# One run at a time, so two quick merges cannot race on values-prod.yaml.
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

# The tag is the commit ci tested, so an image always maps to its source.
env:
  IMAGE: ghcr.io/adam6878/release-notes
  TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  publish:
    # The event check keeps pull requests out, even one opened from a fork's branch named main.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The commit ci tested, not whatever main points at by now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          push: true
          cache-from: type=gha

  update-deployment:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Point prod at the new image
        run: |
          yq -i '.image.repository = strenv(IMAGE) | .image.tag = strenv(TAG)' deploy/values-prod.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(prod): release-notes ${TAG}"
          # A push made with GITHUB_TOKEN does not trigger another workflow run, so this cannot loop.
          git pull --rebase && git push
