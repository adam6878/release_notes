# Weekly PRs that bump the exact pins; CI tests each one before merge.
# No docker entry: a Python bump changes the Dockerfile, ci.yml and mypy.ini together, by hand.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    target-branch: develop
    # One PR for all Python packages instead of one per package.
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    target-branch: develop
